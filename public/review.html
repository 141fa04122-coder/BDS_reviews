<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manchester Biryani House - Feedback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .content {
      padding: 30px 25px;
    }

    .progress-bar {
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .question-container {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.4;
      font-weight: 600;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option {
      padding: 15px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }

    .option:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .option.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      transform: scale(1.02);
    }

    .option input {
      display: none;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radio-circle, .checkbox-square {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checkbox-square {
      border-radius: 6px;
    }

    .option.selected .radio-circle,
    .option.selected .checkbox-square {
      border-color: white;
      background: white;
    }

    .radio-circle::after,
    .checkbox-square::after {
      content: '';
      display: none;
    }

    .option.selected .radio-circle::after {
      display: block;
      width: 10px;
      height: 10px;
      background: #667eea;
      border-radius: 50%;
    }

    .option.selected .checkbox-square::after {
      display: block;
      width: 10px;
      height: 10px;
      background: #667eea;
      border-radius: 2px;
    }

    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 16px 30px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .verification {
      text-align: center;
    }

    .verification h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .success {
      text-align: center;
      padding: 40px 20px;
    }

    .success-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .success h2 {
      color: #333;
      margin-bottom: 10px;
    }

    .success p {
      color: #666;
      line-height: 1.6;
    }

    .progress-text {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-top: 15px;
    }

    .rating-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rating-option {
      flex: 1;
      min-width: 60px;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .header h1 {
        font-size: 1.4rem;
      }
      .question {
        font-size: 1.1rem;
      }
      .rating-options {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Content injected by JS -->
  </div>

  <script>
    const API_BASE = window.location.origin;
    let sessionId = null;
    let customerId = null;
    let currentQuestion = null;
    let answers = {};
    let progress = 0;

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('r');

    // Initialize
    async function init() {
      const app = document.getElementById('app');

      // Show verification screen first
      app.innerHTML = `
        <div class="header">
          <div class="logo">🍛</div>
          <h1>Manchester Biryani House</h1>
          <p>We value your feedback! Please verify to start.</p>
        </div>
        <div class="content verification">
          <h2>Verify Your Order</h2>
          <div class="input-group">
            <label for="phone">Mobile Number (optional)</label>
            <input type="tel" id="phone" placeholder="+44 7...">
          </div>
          <div class="input-group">
            <label for="email">Email Address (optional)</label>
            <input type="email" id="email" placeholder="your@email.com">
          </div>
          <div class="button-group">
            <button class="btn btn-primary" onclick="verify()">Start Survey</button>
          </div>
        </div>
      `;
    }

    async function verify() {
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;

      if (!phone && !email) {
        alert('Please provide at least a phone number or email.');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, email })
        });

        const data = await response.json();

        if (data.verified) {
          sessionId = data.sessionId;
          customerId = data.customerId;
          startSurvey();
        } else {
          alert('Verification failed: ' + data.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Connection error. Please try again.');
      }
    }

    async function startSurvey() {
      try {
        const response = await fetch(`${API_BASE}/api/start-survey?sessionId=${sessionId}&customerId=${customerId}`);
        const data = await response.json();
        currentQuestion = data.question;
        progress = 1;
        renderQuestion();
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to start survey');
      }
    }

    function renderQuestion() {
      const app = document.getElementById('app');
      const question = currentQuestion;

      let optionsHtml = '';

      if (question.type === 'rating') {
        optionsHtml = `
          <div class="options rating-options">
            ${question.options.map(opt => `
              <div class="option rating-option" onclick="selectOption(this, '${opt.value}')">
                <div class="option-label">${opt.label}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'radio') {
        optionsHtml = `
          <div class="options">
            ${question.options.map(opt => `
              <div class="option" onclick="selectOption(this, '${opt.value}')">
                <div class="option-label">
                  <div class="radio-circle"></div>
                  <span>${opt.label}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'checkbox') {
        optionsHtml = `
          <div class="options checkbox-grid">
            ${question.options.map(opt => `
              <div class="option" onclick="toggleCheckbox(this, '${opt.value}')">
                <div class="option-label">
                  <div class="checkbox-square"></div>
                  <span>${opt.label}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'textarea') {
        optionsHtml = `
          <div class="options">
            <textarea
              id="textarea-input"
              placeholder="Your thoughts..."
              maxlength="${question.maxLength || 500}"
              oninput="updateTextareaAnswer(this.value)"
            ></textarea>
          </div>
        `;
      }

      const showBack = progress > 1;

      app.innerHTML = `
        <div class="header">
          <div class="logo">🍛</div>
          <h1>Manchester Biryani House</h1>
          <p>Share your experience with us</p>
        </div>
        <div class="content">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${(progress / 15) * 100}%"></div>
          </div>
          <div class="question-container">
            <div class="question">${question.question}</div>
            ${optionsHtml}
            <div class="button-group">
              ${showBack ? `<button class="btn btn-secondary" onclick="goBack()">Back</button>` : ''}
              <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
            </div>
          </div>
        </div>
      `;

      // Restore checkbox states if navigating back
      if (question.type === 'checkbox' && answers[question.id]) {
        const stored = Array.isArray(answers[question.id]) ? answers[question.id] : [answers[question.id]];
        stored.forEach(val => {
          const el = document.querySelector(`.option[onclick*="'${val}'"]`);
          if (el) el.classList.add('selected');
        });
      }
    }

    function selectOption(element, value) {
      // Deselect all options in this question
      element.parentElement.querySelectorAll('.option').forEach(el => {
        el.classList.remove('selected');
      });
      element.classList.add('selected');
      answers[currentQuestion.id] = value;
      document.getElementById('nextBtn').disabled = false;
    }

    function toggleCheckbox(element, value) {
      element.classList.toggle('selected');

      if (!answers[currentQuestion.id]) {
        answers[currentQuestion.id] = [];
      }

      const selectedOptions = answers[currentQuestion.id];
      const index = selectedOptions.indexOf(value);

      if (index > -1) {
        selectedOptions.splice(index, 1);
      } else {
        selectedOptions.push(value);
      }

      // Keep array sorted for comparison
      answers[currentQuestion.id].sort();

      document.getElementById('nextBtn').disabled = answers[currentQuestion.id].length === 0;
      if (questionIsRequired(currentQuestion) && answers[currentQuestion.id].length > 0) {
        document.getElementById('nextBtn').disabled = false;
      }
    }

    function updateTextareaAnswer(value) {
      answers[currentQuestion.id] = value;
      document.getElementById('nextBtn').disabled = value.trim().length === 0 && questionIsRequired(currentQuestion);
    }

    function questionIsRequired(question) {
      return question.required !== false;
    }

    async function nextQuestion() {
      // Validate required current question
      if (questionIsRequired(currentQuestion) && !answers[currentQuestion.id]) {
        alert('Please answer this question');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/answer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            customerId,
            questionId: currentQuestion.id,
            answer: answers[currentQuestion.id]
          })
        });

        const data = await response.json();

        if (data.complete) {
          completeSurvey();
        } else {
          currentQuestion = data.question;
          progress++;
          renderQuestion();
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to submit answer');
      }
    }

    function goBack() {
      // Simple back navigation - for demo, we'll just decrement progress
      // In production, you'd need to implement proper back-stack
      progress--;
      // For simplicity, we'll just reload and start over on back
      startSurvey();
    }

    async function completeSurvey() {
      try {
        await fetch(`${API_BASE}/api/complete-survey`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            customerId,
            answers
          })
        });

        const app = document.getElementById('app');
        app.innerHTML = `
          <div class="success">
            <div class="success-icon">✅</div>
            <h2>Thank You!</h2>
            <p>Your feedback means a lot to us.</p>
            <p>We'll use your suggestions to improve our service.</p>
            <p style="margin-top: 20px; font-weight: 600;">We hope to see you again soon!</p>
          </div>
        `;
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to complete survey');
      }
    }

    // Start the app
    init();
  </script>
</body>
</html>
