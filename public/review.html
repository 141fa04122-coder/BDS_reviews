<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>We Value Your Feedback | Manchester Biryani House</title>
  <style>
    :root {
      --primary: #B8860B;
      --primary-dark: #8B6914;
      --secondary: #1a1a2e;
      --accent: #C9A94D;
      --bg: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --card: rgba(255, 255, 255, 0.95);
      --text: #2c3e50;
      --text-light: #6c757d;
      --success: #27ae60;
      --gold: linear-gradient(135deg, #B8860B 0%, #DAA520 50%, #B8860B 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      line-height: 1.5;
    }

    .app-wrapper {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
      overflow: hidden;
      position: relative;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Gold accent line at top */
    .gold-top-line {
      height: 4px;
      background: var(--gold);
      background-size: 200% 200%;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Premium Header */
    .header {
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
      background: linear-gradient(to bottom, #fafafa, white);
      border-bottom: 1px solid rgba(184, 134, 11, 0.1);
    }

    .brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      background: var(--gold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
      overflow: hidden;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      text-align: left;
    }

    .brand-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--secondary);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-light);
      font-style: italic;
      margin-top: 8px;
    }

    /* Progress Bar */
    .progress-container {
      padding: 0 24px;
      margin-bottom: 4px;
    }

    .progress-bar {
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: progressShine 2s ease-in-out infinite;
    }

    @keyframes progressShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Content Area */
    .content {
      padding: 24px;
    }

    .question-container {
      animation: fadeInUp 0.35s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 15px;
      line-height: 1.35;
    }

    .question-number {
      display: inline-block;
      background: var(--gold);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      text-align: center;
      line-height: 26px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 8px;
      vertical-align: middle;
      box-shadow: 0 2px 8px rgba(184, 134, 11, 0.3);
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option {
      padding: 16px 20px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: white;
      position: relative;
      overflow: hidden;
    }

    .option::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .option:hover {
      border-color: var(--primary);
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(184, 134, 11, 0.1);
    }

    .option.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      transform: scale(1.01);
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.25);
    }

    .option.selected .option-label span {
      color: white;
    }

    .option input {
      display: none;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .radio-circle, .checkbox-square {
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checkbox-square {
      border-radius: 6px;
    }

    .option.selected .radio-circle,
    .option.selected .checkbox-square {
      border-color: white;
      background: white;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }

    .radio-circle::after,
    .checkbox-square::after {
      content: '';
      display: none;
      transition: all 0.2s;
    }

    .option.selected .radio-circle::after {
      display: block;
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
    }

    .option.selected .checkbox-square::after {
      display: block;
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 3px;
    }

    /* Textarea */
    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      transition: all 0.2s;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 16px 30px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--gold);
      color: white;
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: #d4a843;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(184, 134, 11, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #f8f9fa;
      color: #495057;
      border: 1px solid #dee2e6;
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    /* Verification Screen */
    .verification {
      text-align: center;
      padding: 20px 0;
    }

    .verification h2 {
      font-size: 1.5rem;
      color: var(--secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .verification .subtitle {
      color: var(--text-light);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      font-size: 1rem;
      transition: all 0.2s;
      background: #fafafa;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
      background: white;
    }

    /* Success Screen */
    .success {
      text-align: center;
      padding: 50px 24px;
    }

    .success-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: fadeInUp 0.5s ease-out;
    }

    .success h2 {
      font-size: 1.8rem;
      color: var(--secondary);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .success p {
      color: var(--text-light);
      line-height: 1.6;
      font-size: 1rem;
      max-width: 400px;
      margin: 0 auto;
    }

    .success .highlight {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .reward-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      margin-top: 24px;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
      animation: fadeInUp 0.6s ease-out;
    }

    /*Rating Stars*/
    .star-big {
      font-size: 1.6rem;
      transition: transform 0.2s;
    }

    .rating-options {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .rating-option {
      flex: 1;
      min-width: 55px;
    }

    .rating-option .option {
      text-align: center;
      padding: 14px 10px;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px 24px;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
      font-size: 0.78rem;
      color: #888;
      line-height: 1.5;
    }
    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .developed-by {
      margin-top: 6px;
      font-size: 0.72rem;
      opacity: 0.7;
    }
    .client-info {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
      text-align: left;
      font-size: 0.82rem;
      color: #555;
      line-height: 1.7;
    }
    .client-info strong {
      color: #333;
      display: inline-block;
      min-width: 70px;
    }
    .client-info-row {
      margin-bottom: 4px;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #25D366;
      color: white;
      padding: 8px 18px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .whatsapp-btn:hover {
      background: #20ba5a;
      transform: translateY(-1px);
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    /* Client Logo */
    .client-logo {
      margin-bottom: 18px;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      body {
        align-items: flex-start;
        padding-top: 20px;
      }
      .content {
        padding: 20px 18px;
      }
      .header {
        padding: 22px 20px 16px;
      }
      .brand-logo {
        width: 44px;
        height: 44px;
        font-size: 22px;
      }
      .brand-text h1 {
        font-size: 1.25rem;
      }
      .question {
        font-size: 1.05rem;
      }
      .btn {
        padding: 14px 20px;
      }
      .rating-options {
        flex-direction: column;
      }
      .checkbox-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="gold-top-line"></div>
    <div class="container" id="app">
      <!-- Content injected by JS -->
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let sessionId = null;
    let customerId = null;
    let currentQuestion = null;
    let answers = {};
    let progress = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('r');

    async function init() {
      const app = document.getElementById('app');

      app.innerHTML = `
         <div class="header">
          <div class="brand-container">
            <a href="https://www.businessanddatasolutions.com" target="_blank" title="Visit BDS Tech Team">
            <div class="brand-logo"><img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1770554625/BDS_Logowhite_odmpw0_vyhjes.png" alt="BDS Logo"></div>
            </a>
            <div class="brand-text">
              <h1>Manchester Biryani House</h1>
              <p>Premium Feedback</p>

            </div>
          </div>
          <p class="tagline">Authentic flavours, delivered fresh</p>
        </div>


        <div class="content verification">

          <div class="client-logo" style="margin-bottom: 18px;">
            <img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1778822482/copy_of_whatsapp_image_2026-05-11_at_35235_pm_rhztxk.jpg" alt="Client" style="max-width: 100px; max-height: 80px; object-fit: contain;">
          </div>
          <h2>Your Experience Matters</h2>
          <p class="subtitle">Thank you for ordering with us. This quick survey helps us serve you better.</p>
          <div class="input-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" placeholder="+44 7..." autocomplete="tel">
          </div>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
          </div>
          <div class="button-group">
            <button class="btn btn-primary" onclick="verify()">Start Review</button>
          </div>
        </div>
      `;
    }

    async function verify() {
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;

      if (!phone && !email) {
        alert('Please provide at least a phone number or email to begin.');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, email })
        });

        const data = await response.json();

        if (data.verified) {
          sessionId = data.sessionId;
          customerId = data.customerId;
          startSurvey();
        } else {
          alert('Verification failed: ' + data.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Connection error. Please try again.');
      }
    }

    async function startSurvey() {
      try {
        const response = await fetch(`${API_BASE}/api/start-survey?sessionId=${sessionId}&customerId=${customerId}`);
        const data = await response.json();
        currentQuestion = data.question;
        progress = 1;
        renderQuestion();
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to start survey');
      }
    }

    function renderQuestion() {
      const app = document.getElementById('app');
      const question = currentQuestion;
      const questionNum = progress;

      let optionsHtml = '';

      if (question.type === 'rating') {
        optionsHtml = `
          <div class="options rating-options">
            ${question.options.map(opt => `
              <div class="option rating-option" onclick="selectOption(this, '${opt.value}')">
                <div class="option-label">${opt.label}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'radio') {
        optionsHtml = `
          <div class="options">
            ${question.options.map(opt => `
              <div class="option" onclick="selectOption(this, '${opt.value}')">
                <div class="option-label">
                  <div class="radio-circle"></div>
                  <span>${opt.label}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'checkbox') {
        optionsHtml = `
          <div class="options checkbox-grid">
            ${question.options.map(opt => `
              <div class="option" onclick="toggleCheckbox(this, '${opt.value}')">
                <div class="option-label">
                  <div class="checkbox-square"></div>
                  <span>${opt.label}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (question.type === 'textarea') {
        optionsHtml = `
          <div class="options">
            <textarea id="textarea-input" placeholder="Share your thoughts..." maxlength="${question.maxLength || 500}" oninput="updateTextareaAnswer(this.value)"></textarea>
          </div>
        `;
      }

      const showBack = progress > 1;

      app.innerHTML = `
        <div class="header">
          <div class="brand-container">
            <a href="https://www.businessanddatasolutions.com" target="_blank" title="Visit BDS Tech Team">
            <div class="brand-logo"><img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1770554625/BDS_Logowhite_odmpw0_vyhjes.png" alt="BDS Logo"></div>
            </a>
            <div class="brand-text">
              <h1>Manchester Biryani House</h1>
              <p>Premium Feedback</p>
            </div>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${(progress / 15) * 100}%"></div>
          </div>
          <div class="progress-text">Question ${progress} of ${question.required ? '15' : '~15'}</div>
        </div>
        <div class="content">
          <div class="question-container">
            <div class="question">
              <span class="question-number">${progress}</span>${question.question}
            </div>
            ${optionsHtml}
            <div class="button-group">
              ${showBack ? `<button class="btn btn-secondary" onclick="goBack()">Back</button>` : ''}
              <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Continue</button>
            </div>
          </div>
        </div>
      `;

      // Restore checkbox states if navigating back
      if (question.type === 'checkbox' && answers[question.id]) {
        const stored = Array.isArray(answers[question.id]) ? answers[question.id] : [answers[question.id]];
        stored.forEach(val => {
          const el = document.querySelector(`.option[onclick*="'${val}'"]`);
          if (el) el.classList.add('selected');
        });
      }
    }

    function selectOption(element, value) {
      element.parentElement.querySelectorAll('.option').forEach(el => {
        el.classList.remove('selected');
      });
      element.classList.add('selected');
      answers[currentQuestion.id] = value;
      document.getElementById('nextBtn').disabled = false;
    }

    function toggleCheckbox(element, value) {
      element.classList.toggle('selected');

      if (!answers[currentQuestion.id]) {
        answers[currentQuestion.id] = [];
      }

      const selectedOptions = answers[currentQuestion.id];
      const index = selectedOptions.indexOf(value);

      if (index > -1) {
        selectedOptions.splice(index, 1);
      } else {
        selectedOptions.push(value);
      }

      answers[currentQuestion.id].sort();

      document.getElementById('nextBtn').disabled = answers[currentQuestion.id].length === 0;
      if (questionIsRequired(currentQuestion) && answers[currentQuestion.id].length > 0) {
        document.getElementById('nextBtn').disabled = false;
      }
    }

    function updateTextareaAnswer(value) {
      answers[currentQuestion.id] = value;
      document.getElementById('nextBtn').disabled = value.trim().length === 0 && questionIsRequired(currentQuestion);
    }

    function questionIsRequired(question) {
      return question.required !== false;
    }

    async function nextQuestion() {
      if (questionIsRequired(currentQuestion) && !answers[currentQuestion.id]) {
        alert('Please answer this question');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/answer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            customerId,
            questionId: currentQuestion.id,
            answer: answers[currentQuestion.id]
          })
        });

        const data = await response.json();

        if (data.complete) {
          completeSurvey();
        } else {
          currentQuestion = data.question;
          progress++;
          renderQuestion();
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to submit answer');
      }
    }

    function goBack() {
      progress--;
      startSurvey();
    }

    async function completeSurvey() {
      try {
        await fetch(`${API_BASE}/api/complete-survey`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            customerId,
            answers
          })
        });

        const app = document.getElementById('app');
        app.innerHTML = `
