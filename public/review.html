<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feedback | The Biryanis</title>
  <style>
    :root {
      --primary: #B8860B;
      --primary-dark: #8B6914;
      --secondary: #1a1a2e;
      --bg: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      --card: #ffffff;
      --text: #2c3e50;
      --text-light: #6c757d;
      --success: #27ae60;
      --gold: linear-gradient(135deg, #B8860B 0%, #DAA520 50%, #B8860B 100%);
      --radius: 20px;
      --shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Gold accent line */
    .gold-line {
      height: 4px;
      background: var(--gold);
    }

    /* Header */
    .header {
      padding: 24px 20px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(to bottom, #fafafa, #fff);
      border-bottom: 1px solid rgba(184, 134, 11, 0.15);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      background: var(--gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(184, 134, 11, 0.3);
      overflow: hidden;
      text-decoration: none;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--secondary);
      line-height: 1.2;
      margin: 0 0 2px 0;
    }

    .brand-text .tagline {
      font-size: 0.8rem;
      color: var(--text-light);
      font-style: italic;
    }

    /* Progress */
    .progress-wrap {
      padding: 16px 24px 8px;
    }

    .progress-bar {
      height: 5px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-light);
      margin-top: 5px;
      font-weight: 500;
    }

    /* Content */
    .content {
      padding: 20px 24px 24px;
    }

    .question-box {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .question-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--gold);
      color: #fff;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 8px;
      flex-shrink: 0;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option {
      padding: 14px 16px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option:hover {
      border-color: var(--primary);
      background: #fffdf5;
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--gold);
      color: #fff;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.25);
    }

    .option input { display: none; }

    .check-circle, .check-box {
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .check-box { border-radius: 5px; }

    .option.selected .check-circle,
    .option.selected .check-box {
      border-color: #fff;
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    .check-circle::after, .check-box::after {
      content: '';
      display: none;
    }

    .option.selected .check-circle::after {
      display: block;
      width: 9px;
      height: 9px;
      background: var(--primary);
      border-radius: 50%;
    }

    .option.selected .check-box::after {
      display: block;
      width: 9px;
      height: 9px;
      background: var(--primary);
      border-radius: 2px;
    }

    .option-label-text {
      flex: 1;
      font-size: 0.95rem;
    }

    /* Checkbox grid */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Rating */
    .rating-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .rating-item {
      flex: 1;
      min-width: 56px;
      text-align: center;
    }

    /* Textarea */
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 90px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 15px 20px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
    }

    .btn-primary {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f1f3f5;
      color: #495057;
      border: 1px solid #dee2e6;
    }

    /* Verification */
    .verify-box {
      text-align: center;
      padding: 10px 0 20px;
    }

    .verify-box h2 {
      font-size: 1.4rem;
      color: var(--secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .verify-box p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      font-size: 1rem;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    /* Client logo on verify */
    .client-logo-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .client-logo-wrap img {
      max-width: 90px;
      max-height: 70px;
      object-fit: contain;
    }

    /* Success */
    .success-box {
      text-align: center;
      padding: 30px 24px 20px;
    }

    .success-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .success-box h2 {
      font-size: 1.6rem;
      color: var(--secondary);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .success-box p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-bottom: 8px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .reward-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--success);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 16px;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
    }

    /* Client info block */
    .client-info {
      margin-top: 22px;
      padding: 18px;
      background: #f8f9fa;
      border-radius: 14px;
      text-align: left;
      font-size: 0.82rem;
      color: #555;
      line-height: 1.6;
    }

    .client-info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .client-info-row:last-child {
      margin-bottom: 0;
    }

    .client-info-icon {
      flex-shrink: 0;
      width: 18px;
      text-align: center;
    }

    .client-info a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .client-info a:hover {
      text-decoration: underline;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #25D366;
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      margin-top: 12px;
      transition: all 0.2s;
    }

    .wa-btn:hover {
      background: #20ba5a;
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 18px 24px;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.7;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-divider {
      display: inline-block;
      margin: 0 6px;
      opacity: 0.4;
    }

    .footer-credit {
      margin-top: 6px;
      font-size: 0.7rem;
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 6px;
        align-items: flex-start;
        padding-top: 16px;
      }

      .app-wrapper {
        border-radius: 16px;
      }

      .header {
        padding: 18px 16px 16px;
        gap: 10px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }

      .brand-text h1 {
        font-size: 1.1rem;
      }

      .brand-text .tagline {
        font-size: 0.72rem;
      }

      .content {
        padding: 16px 18px 20px;
      }

      .question-label {
        font-size: 0.95rem;
      }

      .option {
        padding: 12px 14px;
      }

      .option-label-text {
        font-size: 0.88rem;
      }

      .btn {
        padding: 14px 16px;
        font-size: 0.92rem;
        min-height: 48px;
      }

      .checkbox-grid {
        grid-template-columns: 1fr;
      }

      .verify-box h2 {
        font-size: 1.25rem;
      }

      .progress-wrap {
        padding: 12px 18px 6px;
      }

      .client-info {
        padding: 14px;
        font-size: 0.78rem;
      }

      .footer {
        padding: 14px 18px;
        font-size: 0.7rem;
      }
    }

    @media (max-width: 360px) {
      .brand-text h1 {
        font-size: 1rem;
      }
      .question-label {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="gold-line"></div>
    <div id="app"></div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let sessionId = null;
    let customerId = null;
    let currentQuestion = null;
    let answers = {};
    let progress = 0;

    function renderVerify() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <a href="https://www.businessanddatasolutions.com" target="_blank" title="BDS Tech Team" class="brand-logo">
            <img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1770554625/BDS_Logowhite_odmpw0_vyhjes.png" alt="BDS">
          </a>
          <div class="brand-text">
            <h1>The Biryanis</h1>
            <div class="tagline">Authentic flavours, delivered fresh</div>
          </div>
        </div>
        <div class="content">
          <div class="client-logo-wrap">
            <img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1778822482/copy_of_whatsapp_image_2026-05-11_at_35235_pm_rhztxk.jpg" alt="The Biryanis">
          </div>
          <div class="verify-box">
            <h2>We Value Your Feedback</h2>
            <p>Share your experience — it only takes 2 minutes!</p>
          </div>
          <div class="input-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" placeholder="+44 7..." autocomplete="tel">
          </div>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="verify()">Start Survey</button>
          </div>
        </div>
      `;
    }

    function renderProgress(show) {
      if (!show) return '';
      return `
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${(progress / 15) * 100}%"></div>
          </div>
          <div class="progress-text">Question ${progress} of ~15</div>
        </div>
      `;
    }

    async function verify() {
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;

      if (!phone && !email) {
        alert('Please provide a phone number or email to begin.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, email })
        });
        const data = await res.json();
        if (data.verified) {
          sessionId = data.sessionId;
          customerId = data.customerId;
          startSurvey();
        } else {
          alert('Verification failed: ' + data.message);
        }
      } catch (e) {
        alert('Connection error. Please try again.');
      }
    }

    async function startSurvey() {
      try {
        const res = await fetch(`${API_BASE}/api/start-survey?sessionId=${sessionId}&customerId=${customerId}`);
        const data = await res.json();
        currentQuestion = data.question;
        progress = 1;
        renderQuestion();
      } catch (e) {
        alert('Failed to start survey');
      }
    }

    function renderQuestion() {
      const app = document.getElementById('app');
      const q = currentQuestion;

      let html = `<div class="header">
        <a href="https://www.businessanddatasolutions.com" target="_blank" title="BDS Tech Team" class="brand-logo">
          <img src="https://res.cloudinary.com/dsf4d41i8/image/upload/v1770554625/BDS_Logowhite_odmpw0_vyhjes.png" alt="BDS">
        </a>
        <div class="brand-text">
          <h1>The Biryanis</h1>
          <div class="tagline">Authentic flavours, delivered fresh</div>
        </div>
      </div>
      ${renderProgress(true)}
      <div class="content">
        <div class="question-box">
          <div class="question-label"><span class="question-num">${progress}</span>${q.question}</div>`;

      if (q.type === 'rating') {
        html += `<div class="rating-strip">
          ${q.options.map(o => `<div class="rating-item">
            <div class="option" onclick="selectOne(this, '${o.value}')"><div class="option-label-text">${o.label}</div></div>
          </div>`).join('')}
        </div>`;
      } else if (q.type === 'radio') {
        html += `<div class="options">
          ${q.options.map(o => `<div class="option" onclick="selectOne(this, '${o.value}')">
            <div class="check-circle"></div>
            <span class="option-label-text">${o.label}</span>
          </div>`).join('')}
        </div>`;
      } else if (q.type === 'checkbox') {
        html += `<div class="options checkbox-grid">
          ${q.options.map(o => `<div class="option" onclick="toggleCheck(this, '${o.value}')">
            <div class="check-box"></div>
            <span class="option-label-text">${o.label}</span>
          </div>`).join('')}
        </div>`;
      } else if (q.type === 'textarea') {
        html += `<textarea id="ta" placeholder="Share your thoughts..." maxlength="${q.maxLength || 500}" oninput="onTextarea(this.value)"></textarea>`;
      }

      html += `<div class="btn-row">
        ${progress > 1 ? `<button class="btn btn-secondary" onclick="goBack()">Back</button>` : ''}
        <button class="btn btn-primary" id="nextBtn" onclick="nextQ()" disabled>Continue</button>
      </div></div></div>`;

      app.innerHTML = html;

      // Restore state
      if (q.type === 'checkbox' && answers[q.id]) {
        answers[q.id].forEach(v => {
          const el = document.querySelector(`.option[onclick*="'${v}'"]`);
          if (el) el.classList.add('selected');
        });
      }
    }

    function selectOne(el, val) {
      el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      answers[currentQuestion.id] = val;
      document.getElementById('nextBtn').disabled = false;
    }

    function toggleCheck(el, val) {
      el.classList.toggle('selected');
      answers[currentQuestion.id] = answers[currentQuestion.id] || [];
      const arr = answers[currentQuestion.id];
      const i = arr.indexOf(val);
      i > -1 ? arr.splice(i, 1) : arr.push(val);
      arr.sort();
      document.getElementById('nextBtn').disabled = arr.length === 0;
      if (currentQuestion.required && arr.length > 0) document.getElementById('nextBtn').disabled = false;
    }

    function onTextarea(v) {
      answers[currentQuestion.id] = v;
      document.getElementById('nextBtn').disabled = v.trim().length === 0 && currentQuestion.required !== false;
    }

    function required(q) {
      return q.required !== false;
    }

    async function nextQ() {
      if (required(currentQuestion) && !answers[currentQuestion.id]) {
        alert('Please answer this question');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/answer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, customerId, questionId: currentQuestion.id, answer: answers[currentQuestion.id] })
        });
        const data = await res.json();
        if (data.complete) {
          completeSurvey();
        } else {
          currentQuestion = data.question;
          progress++;
          renderQuestion();
        }
      } catch (e) {
        alert('Failed to submit answer');
      }
    }

    function goBack() {
      progress--;
      startSurvey();
    }

    async function completeSurvey() {
      try {
        const res = await fetch(`${API_BASE}/api/complete-survey`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, customerId, answers })
        });
        const data = await res.json();
        if (data.success) {
          const waNote = data.joinWhatsApp ? ' +25 WhatsApp bonus!' : '';
          window.location.href = `${API_BASE}/loyalty.html?cid=${customerId}&pts=${data.totalPoints||0}&ref=${encodeURIComponent(data.referralCode||'')}&promo=${data.referralCode||''}&wa=${data.joinWhatsApp?'1':'0'}${waNote}`;
          return;
        }
      } catch (e) {}
      // Fallback redirect
      window.location.href = `${API_BASE}/loyalty.html?cid=${customerId}`;
    }

    renderVerify();
  </script>
</body>
</html>
