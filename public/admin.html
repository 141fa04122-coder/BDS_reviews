<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Dashboard - Manchester Biryani House</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    .header p {
      opacity: 0.9;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      color: #666;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    .section {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.3rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
    }
    tr:hover {
      background: #f8f9ff;
    }
    .rating {
      color: #f59e0b;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-yes { background: #d4edda; color: #155724; }
    .badge-maybe { background: #fff3cd; color: #856404; }
    .badge-no { background: #f8d7da; color: #721c24; }
    .export-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .export-btn:hover {
      opacity: 0.9;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state h3 {
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍛 Manchester Biryani House</h1>
      <p>Customer Feedback Dashboard</p>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalResponses">-</div>
        <div class="stat-label">Total Responses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="avgRating">-</div>
        <div class="stat-label">Average Rating</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="positiveFeedback">-</div>
        <div class="stat-label">Positive Feedback</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="repeatCustomers">-</div>
        <div class="stat-label">Will Return</div>
      </div>
    </div>

    <div class="section">
      <h2>📊 All Survey Responses</h2>
      <button class="export-btn" onclick="exportCSV()">Export to CSV</button>
      <table id="responsesTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Rating</th>
            <th>Dishes</th>
            <th>Frequency</th>
            <th>Prefers</th>
            <th>Ambiance</th>
            <th>Will Return</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <h3>No responses yet</h3>
        <p>Start sharing your QR code to collect feedback.</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function loadDashboard() {
      try {
        // For Supabase, we'll query directly
        // Or we can add a new API endpoint: GET /api/admin/responses
        const response = await fetch(`${API_BASE}/api/responses`);
        const data = await response.json();

        if (data.success) {
          renderStats(data.responses);
          renderTable(data.responses);
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('responsesTable').style.display = 'none';
      }
    }

    function renderStats(responses) {
      const total = responses.length;
      document.getElementById('totalResponses').textContent = total;

      if (total > 0) {
        const avgRating = (responses.reduce((sum, r) => sum + (r.overall_rating || 0), 0) / total).toFixed(1);
        document.getElementById('avgRating').textContent = avgRating;

        const positive = responses.filter(r => r.liked_food === true).length;
        document.getElementById('positiveFeedback').textContent = `${Math.round((positive/total)*100)}%`;

        const willReturn = responses.filter(r => r.wants_to_return === 1).length;
        document.getElementById('repeatCustomers').textContent = `${Math.round((willReturn/total)*100)}%`;
      }
    }

    function renderTable(responses) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      responses.forEach(r => {
        const row = document.createElement('tr');
        const date = new Date(r.completed_at).toLocaleDateString();

        let dishes = '-';
        if (r.favourite_dishes) {
          const dishesArr = Array.isArray(r.favourite_dishes) ? r.favourite_dishes : JSON.parse(r.favourite_dishes || '[]');
          dishes = dishesArr.slice(0, 3).join(', ') + (dishesArr.length > 3 ? '...' : '');
        }

        let ratingStars = '';
        if (r.overall_rating) {
          ratingStars = '⭐'.repeat(r.overall_rating);
        }

        let returnBadge = '';
        if (r.wants_to_return === 1) returnBadge = '<span class="badge badge-yes">Yes</span>';
        else if (r.wants_to_return === 0) returnBadge = '<span class="badge badge-maybe">Maybe</span>';
        else if (r.wants_to_return === -1) returnBadge = '<span class="badge badge-no">No</span>';

        row.innerHTML = `
          <td>${date}</td>
          <td class="rating">${ratingStars} (${r.overall_rating || '-'})</td>
          <td>${dishes}</td>
          <td>${r.visit_frequency || '-'}</td>
          <td>${r.food_preferences ? r.food_preferences.substring(0, 30) + '...' : '-'}</td>
          <td>${r.ambiance_preference ? r.ambiance_preference.substring(0, 30) + '...' : '-'}</td>
          <td>${returnBadge}</td>
          <td>${(r.additional_comments || '-').substring(0, 50)}${r.additional_comments && r.additional_comments.length > 50 ? '...' : ''}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function exportCSV() {
      window.location.href = `${API_BASE}/api/export/csv`;
    }

    // Load on startup
    loadDashboard();
  </script>
</body>
</html>
